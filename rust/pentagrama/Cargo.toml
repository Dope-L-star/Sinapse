[package]
name = "pentagrama"
version = "1.0.0"
edition = "2021"
description = "Motor de animación de SymphorIA «Partitura»: las 5 líneas del pentagrama, el cargador «Afinando» y las chispas. Se compila a WebAssembly."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
