<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0c10"><meta name="robots" content="noindex"><title>Sin conexión · Offline · SynthFlow</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#060509;color:#f6f3ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(700px 420px at 50% 18%,rgba(123,63,242,.22),transparent 65%),radial-gradient(600px 400px at 85% 100%,rgba(255,61,154,.12),transparent 60%),#060509}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center;box-sizing:border-box}
.o-orb{position:relative;display:grid;place-items:center;width:132px;height:132px;margin-bottom:10px;animation:oIn 1s cubic-bezier(.22,1,.36,1) both}
.o-orb i{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(157,108,255,.55);animation:oRing 2.8s cubic-bezier(.22,1,.36,1) infinite}
.o-orb i:nth-child(2){animation-delay:.9s}.o-orb i:nth-child(3){animation-delay:1.8s}
.o-orb b{position:relative;display:grid;place-items:center;width:84px;height:84px;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 50px -20px rgba(123,63,242,.9),inset 0 1px 0 rgba(255,255,255,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.o-orb svg{width:40px;height:40px;stroke:#f6f3ff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.o-orb svg .w{stroke-dasharray:30;animation:oWave 2.8s ease-in-out infinite}
.o-orb svg .w2{animation-delay:.25s}
@keyframes oRing{0%{transform:scale(.62);opacity:0}25%{opacity:1}100%{transform:scale(1.35);opacity:0}}
@keyframes oWave{0%,100%{stroke-dashoffset:30;opacity:.25}45%,60%{stroke-dashoffset:0;opacity:1}}
@keyframes oIn{from{opacity:0;transform:translateY(24px) scale(.92);filter:blur(8px)}}
@keyframes oUp{from{opacity:0;transform:translateY(18px);filter:blur(6px)}}
h1{margin:0;font-weight:700;font-size:clamp(38px,9vw,60px);line-height:1.02;letter-spacing:-.04em;background:linear-gradient(100deg,#fff 0 40%,#3de0ff 48%,#ff3d9a 54%,#fff 62% 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:oUp .9s .12s cubic-bezier(.22,1,.36,1) both,oShine 2s .5s cubic-bezier(.22,1,.36,1) both}
@keyframes oShine{from{background-position:100% 0}to{background-position:0 0}}
p{margin:0;max-width:34ch;color:#b4adcf;font-size:17px;line-height:1.5;animation:oUp .9s .24s cubic-bezier(.22,1,.36,1) both}
p.en{font-size:14px;color:#8d87a3;animation-delay:.34s}
button{margin-top:14px;padding:14px 28px;min-height:48px;border-radius:999px;border:0;background:linear-gradient(120deg,#9b5cff,#ff3d9a 60%,#ff7a45);background-size:180% 100%;color:#fff;font:600 16px/1 inherit;letter-spacing:-.01em;cursor:pointer;box-shadow:0 14px 34px -14px rgba(255,61,154,.85);transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s;animation:oUp .9s .44s cubic-bezier(.22,1,.36,1) both,oGo 6s ease-in-out infinite alternate}
@keyframes oGo{to{background-position:100% 0}}
button:hover{transform:translateY(-2px);box-shadow:0 18px 40px -14px rgba(255,61,154,1)}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid #3de0ff;outline-offset:4px}
small{margin-top:18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6c6680;animation:oUp .9s .56s both}
/* Uiverse · necatimertmetin (#36): unas «Z» suben del ícono como si la conexión se hubiera quedado dormida */
.o-orb::before,.o-orb::after,.o-orb b::before,.o-orb b::after{content:"Z";position:absolute;z-index:2;top:6px;right:4px;font-weight:800;font-size:20px;line-height:1;color:#3de0ff;text-shadow:0 0 12px rgba(61,224,255,.7);opacity:0;pointer-events:none;animation:oZz 3.2s ease-out infinite}
.o-orb::after{font-size:15px;color:#c9a8ff;text-shadow:0 0 10px rgba(155,92,255,.8);animation-delay:.8s}
.o-orb b::before{top:-12px;right:-14px;font-size:24px;color:#ff7ab8;text-shadow:0 0 12px rgba(255,61,154,.7);animation-delay:1.6s}
.o-orb b::after{top:-12px;right:-14px;font-size:13px;animation-delay:2.4s}
@keyframes oZz{0%{transform:translate(0,0) rotate(0) scale(.7);opacity:0}15%{opacity:1}100%{transform:translate(56px,-72px) rotate(28deg) scale(1.15);opacity:0}}
/* Uiverse · ParasSalunke (#46), como mejora y no reemplazo: el mismo botón de siempre suma una flecha que avanza y un borde de luz al pasarle el mouse */
button{display:inline-flex;align-items:center;gap:10px;position:relative}
button::after{content:"";width:8px;height:8px;border:solid currentColor;border-width:2px 2px 0 0;transform:rotate(45deg);transition:transform .5s cubic-bezier(.22,1,.36,1)}
button:hover::after,button:focus-visible::after{transform:translateX(4px) rotate(45deg)}
button::before{content:"";position:absolute;inset:-3px;border-radius:inherit;padding:2px;background:linear-gradient(110deg,#3de0ff,#9b5cff 50%,#ff3d9a);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .5s;pointer-events:none}
button:hover::before,button:focus-visible::before{opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}h1{background-position:0 0}}
</style></head>
<body><main><div class="o-orb" aria-hidden="true"><i></i><i></i><i></i><b><svg viewBox="0 0 24 24"><path class="w" d="M2 8.8a15 15 0 0 1 20 0"/><path class="w w2" d="M5.5 12.4a10 10 0 0 1 13 0"/><path d="M9 15.9a5 5 0 0 1 6 0"/><path d="M12 19.5h.01"/><path d="M3 3l18 18"/></svg></b></div><h1>Sin conexión</h1><p>SynthFlow necesita internet para hablar con las IA. Revisa tu conexión y vuelve a intentar.</p><p class="en" lang="en">You're offline. SynthFlow needs internet to talk to the AIs. Check your connection and try again.</p><button type="button" onclick="location.reload()">Reintentar · Retry</button><small>SymphorIA</small></main></body></html>
