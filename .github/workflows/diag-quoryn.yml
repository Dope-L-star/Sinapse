# TEMPORAL: solo para entender por qué la prueba de Quoryn falla en el CI y no en local. Se borra antes de unir el PR.
name: Diag Quoryn
on:
  pull_request:
    paths: ['.github/workflows/diag-quoryn.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Prueba de Quoryn sola, con diagnóstico
        run: DIAG=1 node t/alias/chat.mjs
