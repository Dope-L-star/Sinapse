# Pruebas automáticas en cada Pull Request (y en cada push a main).
# Si algo sale en rojo aquí, no se pasa a main.
name: Pruebas
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Archivos armados al día
        run: node build.mjs --check
      - name: Armar lo que publica Vercel (dist/)
        run: node build.mjs --dist
      - name: Instalar Playwright y Chromium
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Prueba de humo (repo)
        run: node t/humo/humo.mjs
      - name: Prueba de humo (dist, minificado)
        run: node t/humo/humo.mjs dist
      - name: Descarga de Obertura (repo nuevo y plan B)
        run: node t/humo/descarga-windows.mjs
      - name: Sesión en cookie
        run: node t/humo/sesion.mjs
      - name: Mensajes de prueba (se cuentan bien)
        run: node t/humo/prueba-mensajes.mjs
      - name: Calidad de la portada (6 pantallas)
        run: node t/portada/calidad.mjs
      - name: Portada solo para gente nueva (pantallita «Ya tengo el Flow / Soy nuevo»)
        run: node t/portada/solo-nuevos.mjs
      - name: Fotos para las IAs y revisión de calidad
        run: node t/humo/ia-fotos.mjs
      - name: Personalidad de SynthonIA
        run: node t/synthonia/personalidad.mjs
      - name: Sona responde con sentido (tipo de mensaje, datos justos, guardia de relevancia, cuidado)
        run: node t/synthonia/relevancia.mjs
      - name: Sona en el navegador (charla propia, respuestas guardadas estrictas, trabajos al chat; ES/EN)
        run: node t/synthonia/charla.mjs
      - name: Ventanita de Sona como compañera (escenario, estados, micrófono, celular; ES/EN)
        run: node t/synthonia/ventana.mjs
      - name: Contrato de Quoryn (antes A.L.I.A.S.) y cribado de lo fácil
        run: node t/alias/contrato.mjs && node t/alias/triage.mjs
      - name: Quoryn dentro del chat (hola → Relay, pedido real → plan, trabaja solo, solo equipo)
        run: node t/alias/chat.mjs
      - name: Cerebro de las IAs (tipo de trabajo, pensar en lo difícil, respuesta vacía → otra IA)
        run: node t/cerebro/cerebro.mjs
      - name: Internet con regla fija (misma pregunta, misma decisión; SynthFlow y Quoryn iguales)
        run: node --test t/web/regla.test.mjs
      - name: Frases de carga (al azar, con nombre, nunca repetidas; ES/EN)
        run: node --test t/web/frases-carga.test.mjs
      - name: Permisos y límites por persona (Pulsem › Usuarios, con Redis local) y reglas premium
        run: sudo apt-get install -y redis-server && node t/humo/permisos.mjs && node t/premium/premium.mjs
      - name: Vista previa de temas y panel admin nuevo (ES/EN)
        run: node --test next/tests/vista-temas.test.mjs next/tests/panel-admin.test.mjs next/tests/gestion.test.mjs
  obertura:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: escritorio/go.mod
          cache-dependency-path: escritorio/go.sum
      - name: Instalador de Windows (pruebas y armado)
        run: node escritorio/armar.mjs 0.0.1
